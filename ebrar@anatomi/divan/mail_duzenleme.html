<style>
  p {
    margin-bottom: 0px;
    color: #545253;  
  }
  .signature-container {
    padding: 30px;
    font-family: sans-serif;
  }
  .lines-wrapper {
  display: flex;
  gap: 20px;
  align-items: flex-end;
  width: 100%;
}

.line-group {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.line-group-1 {
  width: 90%;
}

.line-group-2 {
  width: 10%;
}

.line {
  width: 100%;
  height: 4px;
}

.gray {
  background-color: #545253;
}

.blue {
  background-color: #0E78BD
}

.info-wrapper {
  display: flex;
  justify-content: space-between;
}

.social-icons-container {
  display: flex;
  justify-content: space-between;
  margin-top: 16px;
}

.social-icons {
  display: flex;
  gap: 16px;
  align-items: center;
}

.social-icons a {
  color: #1e6bd6; 
  font-size: 20px;
  text-decoration: none;
}

.social-icons a:hover {
  color: #0f4fbf;
}

.name-surname-container {
  width: 70%;
}
.name-surname-container p:nth-child(1) {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 0px;
}
.name-surname-container p:nth-child(2) {
    font-size: 18px;
    margin-top: 5px;
}

.address-container {
  width: 80%;
}

.logo{
  display: flex;
  justify-content: flex-end;
  align-items: flex-end;
  height: 108px;
}

@media screen and (min-width: 750px) and (max-width: 1050px) {
  .logo {
    height: 127px;
  }
}

@media screen and (max-width: 749px) {
  .logo {
    height: 145px;
  }

}

@media  screen and (max-width: 600px) {
  .info-wrapper {
    flex-direction: column;
  }
  .logo {
    height: 195px;
  }
}

</style>
